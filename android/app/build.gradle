plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.huawei.agconnect"
}

def getGCMSenderId() {
    Properties properties = new Properties()
    properties.load(project.rootProject.file('local.properties').newDataInputStream())
    return properties.getProperty("gcmsenderid")
}

// `flutter run/test --dart-define=KEY=value` reaches Gradle as base64 encoded pairs.
def dartDefines = [:]
if (project.hasProperty('dart-defines')) {
    project.property('dart-defines').split(',').each { entry ->
        def pair = new String(entry.decodeBase64(), 'UTF-8').split('=', 2)
        if (pair.size() == 2) dartDefines[pair[0]] = pair[1]
    }
}

def getHMSSenderId() {
    Properties properties = new Properties()
    properties.load(project.rootProject.file('local.properties').newDataInputStream())
    return properties.getProperty("hmssenderid")
}

android {
    compileSdk 36
    ndkVersion "27.0.12077973"
    namespace "com.netmera.demo.flutter"

    lint {
        disable 'InvalidPackage'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.netmera.demo.flutter"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode 1
        versionName "3.3.0"

        buildConfigField "String", "GCM_SENDER_ID", "\"" + getGCMSenderId() + "\""
        buildConfigField "String", "HMS_SENDER_ID", "\"" + getHMSSenderId() + "\""
        buildConfigField "String", "NETMERA_TEST_BASE_URL", "\"" + (dartDefines.NETMERA_TEST_BASE_URL ?: "") + "\""

        multiDexEnabled true
    }

    signingConfigs {
        release {
            storeFile file('../netmeraflutter.keystore')
            storePassword 'android'
            keyAlias 'android'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.release
        }
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.release
        }
    }

    buildFeatures.buildConfig true
}

flutter {
    source '../..'
}

dependencies {
    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'com.android.support:multidex:1.0.3'
}
